[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "winiconstudio"
version = "1.0.0"
description = "Windows Icon Studio - Custom Windows Folder & App Icon Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
winiconstudio = "src.cli:main"
winiconstudio-gui = "src.gui.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
